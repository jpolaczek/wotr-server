# SEC-04: weekly pull requests that move the pinned action commits and the NuGet packages forward. Actions move in
# one grouped pull request, since codeql-action/init and codeql-action/analyze must keep the same version; NuGet
# minor and patch updates are grouped, a major version gets its own pull request.
version: 2
updates:
  - package-ecosystem: github-actions
    directory: /
    schedule:
      interval: weekly
    open-pull-requests-limit: 5
    groups:
      actions:
        patterns: ["*"]
  - package-ecosystem: nuget
    directory: /
    schedule:
      interval: weekly
    open-pull-requests-limit: 5
    groups:
      nuget-minor-and-patch:
        update-types: [minor, patch]
