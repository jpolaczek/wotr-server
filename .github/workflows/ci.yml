name: Verify server
on: [push, pull_request]
# Read-only token for every run, pull requests from forks included.
permissions:
  contents: read
# BUILD-03: on a branch other than main a newer push cancels the running check. On main every push keeps its own
# run, since each run checks only its own change: a documentation commit right after a code commit must not cancel
# the code's .NET run.
concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: ${{ github.ref != 'refs/heads/main' }}
jobs:
  # Sources, the content coverage ledger and the Python checks run for every change, documentation included (about a
  # minute). The task registry is local-only (docs/tasks, ignored by Git) and is not validated here.
  checks:
    runs-on: ubuntu-latest
    outputs:
      code: ${{ steps.scope.outputs.code }}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          fetch-depth: 0
      - name: Code or documentation only
        id: scope
        env:
          BASE: ${{ github.event_name == 'pull_request' && github.event.pull_request.base.sha || github.event.before }}
        run: python3 scripts/ci_scope.py "$BASE" "$GITHUB_SHA" >> "$GITHUB_OUTPUT"
      - run: python3 -m unittest discover -s tests/ci -p 'test_*.py' -v
      - run: python3 -m unittest discover -s tests/packages -p 'test_*.py' -v
      - run: python3 -m unittest discover -s tests/release -p 'test_*.py' -v
      - run: python3 -m unittest discover -s tests/bots -p 'test_*.py' -v
      - run: python3 scripts/bot_coverage.py
      - run: python3 scripts/source_cards.py
      - run: python3 scripts/card_coverage.py --check
      - run: python3 scripts/source_lords_cards.py
      - run: python3 scripts/lords_card_coverage.py --check
      - run: python3 scripts/source_kings_cards.py
      - run: python3 scripts/kings_card_coverage.py --check
      - run: python3 scripts/fate_card_coverage.py --check
      - run: python3 scripts/fate_character_coverage.py --check
      - run: python3 scripts/fate_acceptance.py
      - run: python3 scripts/expansion_acceptance.py
  # The .NET build and tests with PostgreSQL (about 12 minutes) run only when the change touches more than
  # documentation (scripts/ci_scope.py).
  backend:
    needs: checks
    if: needs.checks.outputs.code == 'true'
    runs-on: ubuntu-latest
    services:
      postgres:
        image: postgres:17
        env:
          POSTGRES_USER: wotr
          POSTGRES_PASSWORD: ci-only
          POSTGRES_DB: wotr_test
        ports: ['5432:5432']
        options: >-
          --health-cmd pg_isready --health-interval 5s --health-timeout 5s --health-retries 10
    env:
      WOTR_TEST_DB: Host=localhost;Port=5432;Username=wotr;Password=ci-only;Database=wotr_test
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: actions/setup-dotnet@0f4a354dd5547a28c70b7853dbd95d5b67886e73 # v6.1.0
        with:
          global-json-file: global.json
      # The restart tests start their own PostgreSQL cluster (IsolatedPostgres) and need the server tools on the
      # runner; the service container above serves every other test.
      - name: PostgreSQL server tools for the isolated restart tests
        run: |
          if ! ls /usr/lib/postgresql/*/bin/initdb >/dev/null 2>&1; then
            sudo apt-get update
            sudo apt-get install -y postgresql
          fi
          ls -d /usr/lib/postgresql/*/bin
      - run: dotnet restore --locked-mode
      # In one test host the suite outgrows this runner's memory, and the kernel kills the runner (docs/TESTING.md, EXP-10). A test host starting
      # while a CPU-heavy test runs may wait longer for its first connection than production's five seconds.
      - name: Backend tests, in six test hosts
        env:
          WOTR_DB_POOL_WAIT_SECONDS: '30'
        run: bash scripts/test_parts.sh .artifacts/test-results
      - name: Verify bot inventory against the compiled public engine
        run: |
          dotnet restore tools/Wotr.BotCatalog --locked-mode
          python3 scripts/bot_coverage.py --generate
          git diff --exit-code -- docs/bots
      - name: Keep the optional private bot out of the ordinary server distribution
        run: |
          dotnet publish src/Wotr.Server -c Release --no-build --no-restore -o .artifacts/public-server
          python3 scripts/check_public_artifacts.py .artifacts/public-server
      - run: python3 scripts/card_coverage.py --check --results .artifacts/test-results/backend.trx
      - run: python3 scripts/lords_card_coverage.py --check --results .artifacts/test-results/backend.trx
      - run: python3 scripts/kings_card_coverage.py --check --results .artifacts/test-results/backend.trx
      - run: python3 scripts/fate_card_coverage.py --check --results .artifacts/test-results/backend.trx
      - run: python3 scripts/fate_character_coverage.py --check --results .artifacts/test-results/backend.trx
      - run: python3 scripts/fate_acceptance.py --results .artifacts/test-results/backend.trx
      - run: python3 scripts/expansion_acceptance.py --results .artifacts/test-results/backend.trx
