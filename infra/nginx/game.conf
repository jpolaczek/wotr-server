# DIST-04: wotr.<domain> behind the shared portfolio tunnel. The game page is static; everything else is the
# server's API, health and WebSockets. The access log omits query strings, which can carry table codes.
log_format game '$remote_addr [$time_local] "$request_method $uri $server_protocol" $status $body_bytes_sent $request_time';

map $http_upgrade $connection_upgrade {
  default upgrade;
  '' close;
}

server {
  listen 8080;
  server_name _;
  server_tokens off;
  access_log /dev/stdout game;
  client_max_body_size 256k;

  # cloudflared reaches this server over the private ingress network with the visitor in CF-Connecting-IP.
  # Only private Docker addresses may set it; the server then trusts this proxy alone (WOTR_TRUSTED_PROXY).
  set_real_ip_from 10.0.0.0/8;
  set_real_ip_from 172.16.0.0/12;
  set_real_ip_from 192.168.0.0/16;
  real_ip_header CF-Connecting-IP;

  location = /healthz {
    access_log off;
    default_type text/plain;
    return 200 "ok\n";
  }

  location = / {
    root /usr/share/nginx/html;
    include /etc/nginx/snippets/security-headers.conf;
    add_header Cache-Control "no-cache" always;
    try_files /index.html =404;
  }

  # AUTH-02: account pages (registration, email confirmation, password reset); links from emails carry their token
  # in the fragment, which never reaches this server.
  location /account/ {
    root /usr/share/nginx/html;
    include /etc/nginx/snippets/security-headers.conf;
    add_header Cache-Control "no-cache" always;
    try_files $uri $uri.html =404;
  }

  # ADMIN-01: the admin panel's page; its data comes from /api/admin only for an administrator's admin session.
  location = /admin {
    root /usr/share/nginx/html;
    include /etc/nginx/snippets/security-headers.conf;
    add_header Cache-Control "no-store" always;
    try_files /admin.html =404;
  }

  location /assets/ {
    root /usr/share/nginx/html;
    include /etc/nginx/snippets/security-headers.conf;
    add_header Cache-Control "public, max-age=300" always;
  }

  location / {
    proxy_pass http://server:8080;
    proxy_http_version 1.1;
    proxy_set_header Host $host;
    # Overwrite, never append: the server sees the visitor's address and HTTPS of the tunnel's edge only.
    proxy_set_header X-Forwarded-For $remote_addr;
    proxy_set_header X-Forwarded-Proto https;
    proxy_set_header X-Real-IP $remote_addr;
    proxy_set_header Forwarded "";
    proxy_set_header Upgrade $http_upgrade;
    proxy_set_header Connection $connection_upgrade;
    # Match WebSockets stay open between the server's heartbeats; the client reconnects after a break.
    proxy_read_timeout 1h;
    proxy_send_timeout 1h;
    proxy_buffering off;
  }
}
